<!doctype html>
<!--
  index.html — the single page that hosts the whole app.
  There is no build step: the browser loads css/app.css and js/app.js directly.
  js/app.js then draws each "screen" into <main id="view"> based on the URL hash
  (#/home, #/routines, ...). All paths are relative so the app also works when
  GitHub Pages serves it from a sub-folder like /setline/.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e10">
  <meta name="color-scheme" content="dark">
  <title>Setline</title>
  <meta name="description" content="Personal workout tracker">

  <!-- PWA: the manifest tells the phone the app's name, icon and colours for "Add to Home Screen". -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iPhone/iPad read these instead of the manifest. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Setline">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/app.css">
  <!-- type="module" lets us use import/export between JS files. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <!-- Bottom tab bar. app.js adds the "active" class to the current tab. -->
  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Today</span>
    </a>
    <a href="#/routines" data-tab="routines">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg>
      <span>Routines</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7.5 14.5l4-4 3 3 5-5.5"/></svg>
      <span>History</span>
    </a>
    <a href="#/exercises" data-tab="exercises">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      <span>Exercises</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>
</body>
</html>
